name: Validate Issue 82 menu package

on:
  pull_request:
    paths:
      - "docs/07-operations/issue-82/**"
      - "releases/builds/build_issue_82_menu_cards.mjs"
      - "scripts/generate_issue_82_*"
      - "scripts/qa_issue_82_*"
      - ".github/workflows/validate-issue-82-menu-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-82-package-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook QA dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Verify costing and proxy-scenario scope
        run: python scripts/qa_issue_82_costing_pricing_remediation.py
      - name: Verify cross-domain 28-dish integration
        run: python scripts/qa_issue_82_integration.py
      - name: Verify exact workbook package (28 / 101 / 17)
        run: python scripts/qa_issue_82_workbook.py docs/07-operations/issue-82/VARSHAVKA_MENU_COSTING_TECH_CARDS_DRAFT_v2.0.0.xlsx
      - name: Verify current independent Issue 82 contracts
        run: node scripts/qa_issue_82_independent_verification.mjs
