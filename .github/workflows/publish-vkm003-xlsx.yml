name: Publish VKM-003 XLSX

on:
  push:
    branches:
      - agent/var-menu-003-mushroom-ham-approval-pack
    paths:
      - '.github/workflows/publish-vkm003-xlsx.yml'
      - '.github/tmp/vkm003_xlsx/**'

permissions:
  contents: write

jobs:
  reconstruct-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/var-menu-003-mushroom-ham-approval-pack
          fetch-depth: 0
      - name: Reconstruct XLSX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/07-operations/var-menu-003
          cat .github/tmp/vkm003_xlsx/chunk0.b64 \
              .github/tmp/vkm003_xlsx/chunk1.b64 \
              .github/tmp/vkm003_xlsx/chunk2.b64 \
              .github/tmp/vkm003_xlsx/chunk3.b64 \
              .github/tmp/vkm003_xlsx/chunk4.b64 \
            | base64 --decode > docs/07-operations/var-menu-003/VKM-003_MUSHROOM_HAM_CHEF_MANAGER_APPROVAL_DRAFT_v1.0.1.xlsx
          echo 'c550ba53962dea5a1e1f341fa200ae3eacefda07e1a5b71a07688951f5687de5  docs/07-operations/var-menu-003/VKM-003_MUSHROOM_HAM_CHEF_MANAGER_APPROVAL_DRAFT_v1.0.1.xlsx' | sha256sum -c -
      - name: Remove temporary payload and workflow
        run: |
          rm -rf .github/tmp/vkm003_xlsx
          rm -f .github/workflows/publish-vkm003-xlsx.yml
      - name: Commit binary workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(issue-92): publish corrected VKM-003 XLSX v1.0.1'
          git push origin HEAD:agent/var-menu-003-mushroom-ham-approval-pack
